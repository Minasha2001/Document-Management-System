<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Archive File Management System</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }


        /* ================= BACKGROUND ================= */

        .page {
            min-height: 100vh;
            width: 100%;

            background-image: url("background1.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            position: relative;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            padding: 20px 60px 20px 20px;
        }


        /* ================= OVERLAY ================= */

        .overlay {
            position: absolute;
            inset: 0;

            background: rgba(7, 31, 55, 0.38);

            z-index: 1;
        }


        /* =====================================================
           SOUTHERN PROVINCIAL COUNCIL HEADER
        ===================================================== */

        .header {
            position: absolute;

            top: 70px;
            left: 6%;

            display: flex;
            align-items: center;

            z-index: 5;
        }


        /* ================= EMBLEM ================= */

        .logo-box {
            width: 100px;
            height: 130px;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .logo-box img {
            max-width: 88px;
            max-height: 120px;

            object-fit: contain;
        }


        /* ================= VERTICAL LINE ================= */

        .vertical-line {
            width: 2px;
            height: 128px;

            background: #073d70;

            margin: 0 27px 0 15px;
        }


        /* ================= INSTITUTION TEXT ================= */

        .institution {
            color: #083c6e;
        }


        .institution .sinhala {
            font-family: "Noto Sans Sinhala", "Poppins", sans-serif;

            font-size: 40px;

            font-weight: 700;

            line-height: 1.2;
        }


        .institution .tamil {
            font-size: 28px;

            font-weight: 600;

            margin-top: 3px;
        }


        .institution .english {
            font-family: Georgia, serif;

            font-size: 27px;

            font-weight: 600;

            margin-top: 4px;
        }


        /* ================= REGISTER CARD ================= */

        .register-card {
            position: relative;

            z-index: 5;

            width: 650px;

            max-width: 94%;

            /* HEIGHT SLIGHTLY REDUCED */
            padding: 22px 32px 19px;

            background: rgba(255, 255, 255, 0.97);

            border: 1px solid rgba(255, 255, 255, 0.8);

            border-radius: 21px;

            box-shadow:
                0 20px 55px rgba(0, 0, 0, 0.30),
                0 5px 20px rgba(0, 0, 0, 0.10);

            backdrop-filter: blur(12px);

            animation: cardAppear 0.7s ease;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* ================= HEADER ================= */

        .register-header {
            text-align: center;

            margin-bottom: 15px;
        }


        .register-icon {

            width: 55px;
            height: 55px;

            margin: 0 auto 7px;

            border-radius: 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #0d6efd,
                #174a8b
            );

            color: white;

            font-size: 24px;

            box-shadow:
                0 8px 20px rgba(13, 110, 253, 0.25);
        }


        .register-header h1 {

            font-family: 'Libre Baskerville', serif;

            font-size: 32px;

            color: #173b61;

            margin-bottom: 5px;
        }


        .register-header p {

            color: #718096;

            font-size: 15.5px;
        }


        /* ================= FORM ================= */

        .form-grid {

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .input-group {
            width: 100%;
        }


        .input-group label {

            display: block;

            font-size: 15px;

            font-weight: 600;

            color: #34495e;

            margin-bottom: 4px;
        }


        /* ================= INPUT BOX ================= */

        .input-box {

            height: 41px;

            display: flex;

            align-items: center;

            border: 1px solid #d9e1ea;

            border-radius: 10px;

            background: #f9fbfd;

            transition: all 0.25s ease;
        }


        .input-box > i:first-child {

            width: 42px;

            text-align: center;

            color: #6d8ba8;

            font-size: 17px;
        }


        .input-box input,
        .input-box select {

            flex: 1;

            height: 100%;

            border: none;

            outline: none;

            background: transparent;

            font-family: 'Poppins', sans-serif;

            font-size: 15.5px;

            color: #26384a;

            padding-right: 10px;
        }


        .input-box input::placeholder {

            color: #9caab7;

            font-size: 15px;
        }


        .input-box select {

            cursor: pointer;

            color: #526577;
        }


        .input-box:focus-within {

            background: white;

            border-color: #4c8edb;

            box-shadow:
                0 0 0 3px rgba(76, 142, 219, 0.10);
        }


        /* ================= TWO COLUMN ROW ================= */

        .two-column-row {

            width: 100%;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 13px;
        }


        /* ================= PASSWORD ================= */

        .password-box {
            position: relative;
        }


        .password-box input {
            padding-right: 40px;
        }


        .toggle-password {

            position: absolute;

            right: 12px;

            width: auto !important;

            color: #7d8b98 !important;

            cursor: pointer;

            font-size: 15px !important;

            transition: 0.2s;
        }


        .toggle-password:hover {
            color: #315f8c !important;
        }


        /* ================= BUTTONS ================= */

        .button-area {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-top: 12px;
        }


        .btn {

            height: 41px;

            border: none;

            border-radius: 10px;

            font-family: 'Poppins', sans-serif;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.25s ease;
        }


        /* ================= REGISTER BUTTON ================= */

        .register-btn {

            color: white;

            background: linear-gradient(
                135deg,
                #0d6efd,
                #174a8b
            );

            box-shadow:
                0 7px 18px rgba(13, 110, 253, 0.22);
        }


        .register-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 22px rgba(13, 110, 253, 0.30);
        }


        /* ================= BACK BUTTON ================= */

        .back-btn {

            color: #315f8c;

            background: #edf3f8;

            border: 1px solid #d6e0e9;
        }


        .back-btn:hover {

            background: #e2ebf3;

            transform: translateY(-2px);
        }


        /* ================= LOGIN TEXT ================= */

        .login-text {

            text-align: center;

            margin-top: 10px;

            font-size: 13.5px;

            color: #7b8794;
        }


        .login-text a {

            color: #1769aa;

            text-decoration: none;

            font-weight: 600;
        }


        .login-text a:hover {
            text-decoration: underline;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 1200px) {

            .header {
                left: 4%;
            }

        }


        @media (max-width: 900px) {

            .page {

                justify-content: center;

                padding: 20px;
            }


            .header {

                position: relative;

                top: auto;
                left: auto;

                justify-content: center;

                margin-bottom: 20px;
            }

        }


        @media (max-width: 700px) {

            .page {
                flex-direction: column;

                justify-content: center;

                padding: 20px;
            }


            .header {

                display: flex;

                width: 100%;

                margin-bottom: 20px;
            }


            .register-card {

                padding: 22px 20px 19px;
            }


            .two-column-row {

                grid-template-columns: 1fr;
            }


            .button-area {

                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 600px) {

            .header {

                display: block;

                text-align: center;
            }


            .logo-box {

                margin: auto;
            }


            .vertical-line {
                display: none;
            }


            .institution .sinhala {
                font-size: 22px;
            }


            .institution .tamil {
                font-size: 16px;
            }


            .institution .english {
                font-size: 18px;
            }

        }


        @media (max-width: 480px) {

            .page {

                padding: 15px 8px;
            }


            .register-card {

                max-width: 100%;

                border-radius: 18px;
            }


            .register-header h1 {

                font-size: 26px;
            }


            .register-header p {

                font-size: 14px;
            }


            .input-group label {

                font-size: 14px;
            }


            .input-box input,
            .input-box select {

                font-size: 14.5px;
            }


            .btn {

                font-size: 14px;
            }

        }

    </style>
</head>


<body>

<div class="page">

    <div class="overlay"></div>


    <!-- =====================================================
         SOUTHERN PROVINCIAL COUNCIL HEADER
    ====================================================== -->

    <div class="header">

        <!-- EMBLEM -->

        <div class="logo-box">

            <img
                src="logo.jpg"
                alt="Southern Provincial Council Logo"
            >

        </div>


        <!-- VERTICAL LINE -->

        <div class="vertical-line"></div>


        <!-- INSTITUTION TEXT -->

        <div class="institution">

            <div class="sinhala">
                දකුණු පළාත් සභාව
            </div>

            <div class="tamil">
                தெற்கு மாகாண சபை
            </div>

            <div class="english">
                Southern Provincial Council
            </div>

        </div>

    </div>


    <!-- =====================================================
         REGISTER CARD
    ====================================================== -->

    <div class="register-card">


        <!-- HEADER -->

        <div class="register-header">

            <div class="register-icon">

                <i class="fa-solid fa-user-plus"></i>

            </div>


            <h1>
                Create an Account
            </h1>


            <p>
                Register for the Archive File Management System
            </p>

        </div>


        <!-- ================= FORM ================= -->

        <form id="registerForm">

            <div class="form-grid">


                <!-- FULL NAME -->

                <div class="input-group">

                    <label>Full Name</label>

                    <div class="input-box">

                        <i class="fa-solid fa-id-card"></i>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter full name"
                            required
                        >

                    </div>

                </div>


                <!-- NIC NUMBER -->

                <div class="input-group">

                    <label>NIC Number</label>

                    <div class="input-box">

                        <i class="fa-solid fa-address-card"></i>

                        <input
                            type="text"
                            id="nic"
                            placeholder="Enter NIC number"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label>Email</label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email address"
                            required
                        >

                    </div>

                </div>


                <!-- DESIGNATION -->

                <div class="input-group">

                    <label>Designation</label>

                    <div class="input-box">

                        <i class="fa-solid fa-briefcase"></i>

                        <input
                            type="text"
                            id="designation"
                            placeholder="Enter designation"
                            required
                        >

                    </div>

                </div>


                <!-- SUBJECT NUMBER -->

                <div class="input-group">

                    <label>Subject Number</label>

                    <div class="input-box">

                        <i class="fa-solid fa-hashtag"></i>

                        <input
                            type="text"
                            id="subjectNumber"
                            placeholder="Enter subject number"
                            required
                        >

                    </div>

                </div>


                <!-- USER TYPE + DEPARTMENT -->

                <div class="two-column-row">


                    <!-- USER TYPE -->

                    <div class="input-group">

                        <label>User Type</label>

                        <div class="input-box">

                            <i class="fa-solid fa-user-shield"></i>

                            <select
                                id="userType"
                                required
                            >

                                <option
                                    value=""
                                    disabled
                                    selected
                                >
                                    Select user type
                                </option>

                                <option value="Admin">
                                    Admin
                                </option>

                                <option value="Staff">
                                    Staff
                                </option>

                                <option value="User">
                                    User
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- DEPARTMENT -->

                    <div class="input-group">

                        <label>Department</label>

                        <div class="input-box">

                            <i class="fa-solid fa-building"></i>

                            <select
                                id="department"
                                required
                            >

                                <option
                                    value=""
                                    disabled
                                    selected
                                >
                                    Select department
                                </option>

                                <option value="Institutions">
                                    Institutions
                                </option>

                                <option value="Councils">
                                    Councils
                                </option>

                                <option value="Accounts">
                                    Accounts
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <!-- USERNAME -->

                <div class="input-group">

                    <label>Username</label>

                    <div class="input-box">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter username"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD + CONFIRM PASSWORD -->

                <div class="two-column-row">


                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label>Password</label>

                        <div class="input-box password-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter password"
                                required
                            >


                            <i
                                class="fa-solid fa-eye toggle-password"
                                onclick="togglePassword('password', this)"
                            ></i>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="input-group">

                        <label>Confirm Password</label>

                        <div class="input-box password-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm password"
                                required
                            >


                            <i
                                class="fa-solid fa-eye toggle-password"
                                onclick="togglePassword('confirmPassword', this)"
                            ></i>

                        </div>

                    </div>

                </div>


            </div>


            <!-- ================= BUTTONS ================= -->

            <div class="button-area">

                <button
                    type="button"
                    class="btn back-btn"
                    onclick="window.location.href='index.html'"
                >

                    <i class="fa-solid fa-arrow-left"></i>

                    &nbsp; Back to Login

                </button>


                <button
                    type="submit"
                    class="btn register-btn"
                >

                    <i class="fa-solid fa-user-plus"></i>

                    &nbsp; Create Account

                </button>

            </div>

        </form>


        <!-- LOGIN TEXT -->

        <div class="login-text">

            Already have an account?

            <a href="index.html">
                Login here
            </a>

        </div>


    </div>

</div>


<script>

    /* ================= PASSWORD SHOW / HIDE ================= */

    function togglePassword(inputId, icon) {

        const input =
            document.getElementById(inputId);


        if (input.type === "password") {

            input.type = "text";

            icon.classList.remove("fa-eye");

            icon.classList.add("fa-eye-slash");

        }

        else {

            input.type = "password";

            icon.classList.remove("fa-eye-slash");

            icon.classList.add("fa-eye");

        }

    }


    /* ================= FORM VALIDATION ================= */

    document
        .getElementById("registerForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const password =
                document.getElementById("password").value;


            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (password !== confirmPassword) {

                alert(
                    "Password and Confirm Password do not match."
                );

                return;
            }


            if (password.length < 6) {

                alert(
                    "Password must contain at least 6 characters."
                );

                return;
            }


            alert(
                "Registration completed successfully!"
            );

        });

</script>

</body>
</html>
